<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PRODERMA LabControl V1.1 — Connexion</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --brand-950:#0f1f38;--brand-900:#142848;--brand-500:#427edb;
  --brand-100:#e7effa;--brand-50:#f2f7fd;
  --bg-app:#f6f8fb;--bg-surface:#ffffff;--bg-subtle:#f1f4f9;
  --border-light:#e5ebf3;--border-subtle:#d8e2ee;--border-medium:#b9c9dc;
  --border-focus:#3b74c4;--text-main:#131b26;--text-secondary:#4a5b73;
  --text-muted:#74859d;--radius-sm:6px;--radius-md:8px;--radius-lg:12px;
  --shadow-float:0 20px 25px -5px rgba(19,27,38,0.08);
  --transition:all 0.15s cubic-bezier(0.4,0,0.2,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:14px;-webkit-font-smoothing:antialiased}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg-app);color:var(--text-main);line-height:1.45;min-height:100vh}
.font-mono{font-family:'JetBrains Mono',ui-monospace,monospace}
button,input{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
input:focus,button:focus-visible{outline:2px solid var(--border-focus);outline-offset:1px}

.login-screen{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 30%,#f0f4fa 0%,#e2eaf5 100%)}
.login-card{width:100%;max-width:440px;background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);box-shadow:var(--shadow-float);overflow:hidden}
.login-header{padding:32px 32px 20px;border-bottom:1px solid var(--border-light)}
.brand-badge{display:inline-flex;align-items:center;gap:12px;margin-bottom:14px}
.brand-logo-img{width:48px;height:48px;object-fit:contain;border-radius:8px;background:#fff;padding:4px;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,0.08);border:1px solid var(--border-light)}
.brand-icon{width:32px;height:32px;background:#1b2e4d;color:#fff;border-radius:var(--radius-sm);display:grid;place-items:center}
.brand-title{font-size:19px;font-weight:800;letter-spacing:-0.02em;color:var(--brand-950)}
.login-header p{font-size:13px;color:var(--text-secondary)}
.login-body{padding:28px 32px 32px}
.login-footer-info{background:var(--bg-subtle);border:1px solid var(--border-light);border-radius:var(--radius-sm);padding:10px 12px;font-size:12px;color:var(--text-secondary);display:flex;align-items:flex-start;gap:8px;margin-top:20px}
.form-field{display:flex;flex-direction:column;gap:5px}
.form-label{font-size:11.5px;font-weight:600;color:var(--text-secondary)}
.form-input{width:100%;padding:8px 10px;background:var(--bg-surface);border:1px solid var(--border-medium);border-radius:var(--radius-sm);font-size:12.5px;color:var(--text-main);transition:var(--transition)}
.form-input:focus{border-color:var(--brand-500)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:7px 13px;border-radius:var(--radius-sm);font-size:12.5px;font-weight:600;transition:var(--transition);white-space:nowrap}
.btn-primary{background:#1e3a68;color:#fff;border:1px solid #152c50}
.btn-primary:hover{background:#274c87}
.btn-secondary{background:var(--bg-subtle);color:var(--text-secondary);border:1px solid var(--border-medium)}
.btn-secondary:hover{background:var(--border-light)}
.btn-sm{padding:4px 8px;font-size:11.5px;border-radius:4px}
</style>
</head>
<body>

<div class="login-screen">
  <div class="login-card">
    <div class="login-header">
      <div style="display:flex;justify-content:space-between;align-items:flex-start">
        <div class="brand-badge">
          <img src="img/logo.png" alt="PRODERMA" class="brand-logo-img" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'">
          <div class="brand-icon" style="display:none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon></svg></div>
          <div class="brand-title">PRODERMA <span style="font-weight:400;font-size:14px;opacity:0.75;">LabControl V1.1</span></div>
        </div>
        <button class="btn btn-secondary btn-sm" onclick="toggleLang()">FR / AR</button>
      </div>
      <p>Laboratoire d'autocontrôle physico-chimique & microbiologique — Référentiel IANOR / ISO</p>
    </div>
    <div class="login-body">
      <div class="form-field" style="margin-bottom:14px">
        <label class="form-label">Identifiant opérateur</label>
        <input class="form-input" id="loginUser" value="admin">
      </div>
      <div class="form-field" style="margin-bottom:20px">
        <label class="form-label">Mot de passe</label>
        <input class="form-input" id="loginPass" type="password" value="admin">
      </div>
      <button class="btn btn-primary" style="width:100%;padding:10px" onclick="doLogin()">
        <span>Ouvrir la session de contrôle</span>
      </button>
      <div class="login-footer-info">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex-shrink:0;color:var(--text-muted)"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
        <span>Accès d'évaluation : <code class="font-mono" style="font-weight:600">admin / admin</code></span>
      </div>
    </div>
  </div>
</div>

<script>
/* ===== CONFIG STORAGE ===== */
const DBKEY = "proderma_labcontrol_v1";

/* ===== INITIALISATION BASE LOCALE (si absente) ===== */
function ensureDB() {
  let s = JSON.parse(localStorage.getItem(DBKEY) || "null");
  if (!s) {
    s = {
      samples: [
        { id:"S-17101824001", product:"Sérum Niacinamide 10%", lot:"LOT-2026-001", date:"2026-02-14", sampler:"K. Mansouri", qty:"3x 30 mL", loc:"Échantillothèque A-01" },
        { id:"S-17101824002", product:"Shampooing Doux Bébé", lot:"LOT-2026-002", date:"2026-02-15", sampler:"A. Belkacem", qty:"2x 250 mL", loc:"Échantillothèque B-04" }
      ],
      analyses: [
        { id:"PC-101", date:"14/02/2026", lot:"LOT-2026-001", product:"Sérum Niacinamide 10%", family:"Physico-chimie", param:"pH", method:"NA 8288:2015", value:"5.85", unit:"pH", min:"5.5", max:"6.5", equip:"PHM-002", analyst:"admin", status:"Conforme", obs:"Électrode étalonnée" },
        { id:"PC-102", date:"14/02/2026", lot:"LOT-2026-001", product:"Sérum Niacinamide 10%", family:"Physico-chimie", param:"Viscosité", method:"Brookfield", value:"450", unit:"mPa·s", min:"300", max:"600", equip:"VISC-001", analyst:"admin", status:"Conforme" },
        { id:"M-101", date:"15/02/2026", lot:"LOT-2026-001", product:"Sérum Niacinamide 10%", family:"Microbiologie", param:"Bactéries aérobies mésophiles", method:"NA 8287:2018", value:"10", unit:"UFC/g ou mL", max:"1000", equip:"ETU-32C-01", analyst:"admin", status:"Conforme" }
      ],
      lots: [], standards: [], oos: [], importHistory: [],
      history: [{ ts:"14/02/2026 09:15:22", user:"admin", action:"Connexion", detail:"Initialisation session laboratoire" }],
      users: [{ login:"admin", name:"Administrateur PRODERMA", role:"Administrateur", pass:"admin" }],
      signatures: [],
      config: {
        lab:"SARL PRODERMA — Laboratoire d'autocontrôle physico-chimique & microbiologique",
        mode:"open", release:"no"
      }
    };
    localStorage.setItem(DBKEY, JSON.stringify(s));
  }
  return s;
}
ensureDB();

let currentLang = "fr";

function doLogin() {
  const u = document.getElementById("loginUser").value.trim();
  const p = document.getElementById("loginPass").value;
  const s = JSON.parse(localStorage.getItem(DBKEY));
  const found = s.users.find(x => x.login === u && x.pass === p);
  if (!found) { alert("Identifiant ou mot de passe invalide."); return; }

  // Journaliser la connexion
  const now = new Date();
  const pad = n => String(n).padStart(2,'0');
  const ts = `${pad(now.getDate())}/${pad(now.getMonth()+1)}/${now.getFullYear()} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
  s.history.unshift({ ts, user: u, action:"Connexion", detail:"Ouverture session " + u });
  localStorage.setItem(DBKEY, JSON.stringify(s));

  // Mémoriser l'utilisateur connecté pour les autres pages
  sessionStorage.setItem("proderma_user", JSON.stringify({ login: u, name: found.name, role: found.role }));

  // Rediriger vers le tableau de bord
  window.location.href = "dashboard.html";
}

function toggleLang() {
  currentLang = currentLang === "fr" ? "ar" : "fr";
  document.documentElement.dir = currentLang === "ar" ? "rtl" : "ltr";
}
</script>
</body>
</html>
